{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión | Solmed CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f4f6f9;
        }
        .login-card {
            width: 100%;
            max-width: 450px;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border: none;
        }
        .login-logo {
            max-width: 250px;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body class="text-center">

    <main>
        <div class="card login-card">
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <img class="login-logo" src="{% static 'images/logo-solmed.png' %}" alt="Logo Solmed">
                
                <h1 class="h3 mb-3 fw-normal">Iniciar Sesión</h1>

                {% if form.errors %}
                <div class="alert alert-danger" role="alert">
                    Tu nombre de usuario y contraseña no coinciden. Por favor, inténtalo de nuevo.
                </div>
                {% endif %}

                <div class="form-floating mb-3">
                    <input type="text" name="username" class="form-control" id="id_username" placeholder="Nombre de usuario" required autofocus>
                    <label for="id_username">Nombre de usuario</label>
                </div>
                <div class="form-floating">
                    <input type="password" name="password" class="form-control" id="id_password" placeholder="Contraseña" required>
                    <label for="id_password">Contraseña</label>
                </div>

                <button class="w-100 btn btn-lg btn-primary mt-4" type="submit" style="background-color: #008cba; border-color: #008cba;">Ingresar</button>
                <p class="mt-5 mb-3 text-muted">&copy; Solmed {% now "Y" %}</p>
            </form>
        </div>
    </main>

</body>
</html>
