{# Estilos de las pantallas del conductor (oct-2026, rediseño «muy sencillo»). Móvil primero: textos grandes, un botón principal por tarjeta, nada de tablas. #}
<style>
.cd{ max-width:640px; margin:0 auto; }
.cd-cab{ margin-bottom:1.25rem; }
.cd-cab .fecha{ font-family:var(--mono); font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); }
.cd-cab h1{ font-size:1.6rem; font-weight:700; margin:.15rem 0 .2rem; line-height:1.15; }
.cd-cab p{ font-size:1rem; color:var(--ink-2); margin:0; }
.cd-volver{ display:inline-flex; align-items:center; gap:.3rem; min-height:44px; font-size:.95rem; font-weight:600;
    color:var(--steel); text-decoration:none; margin:-.4rem 0 .2rem; }
.cd-volver:hover{ color:var(--steel-600); text-decoration:underline; }

.cd-sec{ display:flex; align-items:baseline; justify-content:space-between; gap:.5rem;
    font-size:.78rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-2);
    margin:1.6rem 0 .6rem; }
.cd-sec .n{ font-family:var(--mono); font-weight:600; color:var(--ink-3); }

/* ---- Tarjeta de un servicio ---- */
.cd-card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:1.1rem 1.1rem 1rem;
    margin-bottom:.85rem; box-shadow:0 1px 2px rgba(14,23,35,.05); }
.cd-card.atrasada{ border-left:5px solid var(--warn); }
.cd-card.cerrada{ background:var(--ok-tint); border-color:var(--ok-line); }
.cd-dir{ display:flex; gap:.5rem; align-items:flex-start; font-size:1.2rem; font-weight:700; line-height:1.3; color:var(--ink); margin:0; }
.cd-dir i{ color:var(--steel); margin-top:.15rem; flex-shrink:0; }
.cd-meta{ font-family:var(--mono); font-size:.82rem; color:var(--ink-2); margin:.35rem 0 0 1.7rem; display:flex; flex-wrap:wrap; gap:.15rem .9rem; }
.cd-meta .cli{ font-family:var(--sans); }
.cd-estado{ display:flex; gap:.55rem; align-items:flex-start; font-size:.95rem; line-height:1.4; margin:.9rem 0 1rem;
    padding:.65rem .8rem; border-radius:10px; }
.cd-estado i{ font-size:1.1rem; flex-shrink:0; margin-top:.05rem; }
.cd-estado.falta{ background:var(--warn-tint); color:#6b4504; }
.cd-estado.falta i{ color:var(--warn); }
.cd-estado.listo{ background:#fff; color:#1f5c33; font-weight:600; border:1px solid var(--ok-line); }
.cd-estado.listo i{ color:var(--ok); }

/* ---- Botones: grandes, al dedo ---- */
.cd-acciones{ display:grid; grid-template-columns:1fr auto; gap:.55rem; }
.cd-btn{ display:flex; align-items:center; justify-content:center; gap:.45rem; min-height:52px; padding:.6rem 1.1rem;
    border-radius:12px; font-size:1.02rem; font-weight:600; text-decoration:none; border:1px solid transparent; cursor:pointer; }
.cd-btn.pri{ background:var(--steel); color:#fff; }
.cd-btn.pri:hover{ background:var(--steel-600); color:#fff; }
.cd-btn.ok{ background:var(--brand-600); color:#fff; }
.cd-btn.ok:hover{ background:var(--brand-700); color:#fff; }
.cd-btn.sec{ background:var(--panel); color:var(--ink); border-color:var(--line); }
.cd-btn.sec:hover{ background:var(--panel-2); color:var(--ink); }
.cd-btn:focus-visible{ outline:3px solid var(--brand); outline-offset:2px; }
.cd-btn[disabled]{ opacity:.6; cursor:default; }

/* ---- Fila compacta (próximos / historial) ---- */
.cd-lista{ background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
.cd-fila{ display:flex; align-items:center; gap:.85rem; padding:.8rem 1rem; min-height:64px; color:var(--ink);
    text-decoration:none; border-top:1px solid var(--line-2); }
.cd-fila:first-child{ border-top:0; }
a.cd-fila:hover{ background:var(--panel-2); color:var(--ink); }
.cd-dia{ width:48px; flex-shrink:0; text-align:center; border:1px solid var(--line); border-radius:10px; padding:.3rem 0; background:var(--panel-2); }
.cd-dia .d{ display:block; font-family:var(--mono); font-size:1.15rem; font-weight:700; line-height:1.1; }
.cd-dia .m{ display:block; font-family:var(--mono); font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); }
.cd-fila .tx{ flex:1; min-width:0; }
.cd-fila .tx .t{ display:block; font-weight:600; line-height:1.3; overflow:hidden; text-overflow:ellipsis; }
.cd-fila .tx .s{ display:block; font-size:.8rem; color:var(--ink-2); margin-top:.1rem; }
.cd-fila .tx .s .mono{ font-family:var(--mono); }
.cd-fila > .bi-chevron-right{ color:var(--ink-3); flex-shrink:0; }
.cd-pill{ font-size:.75rem; font-weight:600; padding:.2rem .55rem; border-radius:99px; white-space:nowrap; flex-shrink:0; }
.cd-pill.listo{ background:var(--ok-tint); color:var(--ok); }
.cd-pill.falta{ background:var(--warn-tint); color:var(--warn); }

.cd-vacio{ text-align:center; padding:1.8rem 1rem; background:var(--panel); border:1px dashed var(--line); border-radius:14px;
    color:var(--ink-2); font-size:1rem; }
.cd-vacio i{ display:block; font-size:1.8rem; color:var(--brand-600); margin-bottom:.35rem; }
@media (max-width:420px){ .cd-acciones{ grid-template-columns:1fr; } }
</style>
