{% extends "gestion/base.html" %}

{% block content %}
<div class="card shadow">
    <div class="card-header">
        <h4 class="mb-0">{% if object %}Editar Cliente{% else %}Añadir Nuevo Cliente{% endif %}</h4>
    </div>
    <div class="card-body">
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="{{ form.nombre.id_for_label }}" class="form-label">{{ form.nombre.label }}</label>
                    {{ form.nombre }}
                </div>
                <div class="col-md-6">
                    <label for="{{ form.identificacion.id_for_label }}" class="form-label">{{ form.identificacion.label }}</label>
                    {{ form.identificacion }}
                </div>
                <div class="col-md-6">
                    <label for="{{ form.telefono.id_for_label }}" class="form-label">{{ form.telefono.label }}</label>
                    {{ form.telefono }}
                </div>
                <div class="col-md-6">
                    <label for="{{ form.email.id_for_label }}" class="form-label">{{ form.email.label }}</label>
                    {{ form.email }}
                </div>
                <div class="col-12">
                    <label for="{{ form.direccion.id_for_label }}" class="form-label">{{ form.direccion.label }}</label>
                    {{ form.direccion }}
                </div>
            </div>
            <hr>
            <div class="d-flex justify-content-end">
                <a href="{% url 'gestion:lista_clientes' %}" class="btn btn-secondary me-2">Cancelar</a>
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check-circle me-1"></i> Guardar Cliente
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
