{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gracias — Solmed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f4f6f9; display: flex; min-height: 100vh; align-items: center; }
        .card-gracias { background: white; padding: 2.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid #dee2e6; max-width: 520px; margin: auto; text-align: center; }
    </style>
</head>
<body>
<div class="card-gracias">
    <img src="{% static 'images/logo-solmed.png' %}" alt="Solmed" style="max-height: 60px;" class="mb-3">
    {% if ya_firmado %}
        <i class="bi bi-info-circle text-secondary" style="font-size: 3.5rem;"></i>
        <h3 class="mt-2">Esta acta ya fue firmada</h3>
        <p class="text-muted">El proceso para este servicio ya se completó. No es necesario volver a llenarlo.</p>
    {% else %}
        <i class="bi bi-check2-circle text-success" style="font-size: 3.5rem;"></i>
        <h3 class="mt-2">¡Gracias por su tiempo!</h3>
        <p class="text-muted">Su encuesta y firma se registraron correctamente. Ya puede cerrar esta página.</p>
    {% endif %}
</div>
</body>
</html>
