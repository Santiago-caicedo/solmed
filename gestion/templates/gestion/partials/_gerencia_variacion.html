{# Variación contra el periodo anterior: flecha y porcentaje, nunca solo color. `v` es None si no hay con qué comparar. #}{% if v is None %}<span>Sin datos del periodo anterior para comparar</span>{% elif v >= 0 %}<span class="delta sube"><i class="bi bi-arrow-up-short" aria-hidden="true"></i>{{ v|floatformat:1 }}%</span>{% else %}<span class="delta baja"><i class="bi bi-arrow-down-short" aria-hidden="true"></i>{{ v|floatformat:1|cut:"-" }}%</span>{% endif %}
